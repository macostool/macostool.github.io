<!DOCTYPE HTML>
<html>
	<head>
		<title id="page-title">macOStool工作室</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<script src="assets/js/jquery.min.js" type="text/javascript"></script>
		<script>
			// 检测是否为中文环境
			var userLang = (navigator.language || navigator.browserLanguage || "").toLowerCase();
			var isChinese = userLang.indexOf('zh') >= 0;

			function goStore() {
				if (isChinese) {
					window.location.href = "https://apps.apple.com/cn/app/mouse-odometer/id6834995798";
				} else {
					window.location.href = "https://apps.apple.com/us/app/mouse-odometer/id6834995798";
				}
			}

			$(document).ready(function () {
				$("#nav").load("nav.html");
				//$("#footer").load("footer.html");
				var d = new Date();
				$("#copyright").html("Copyright © " + d.getFullYear() + " macOStool All Rights Reserved. <br/>E-mail:macostool@qq.com");

				if (isChinese) {
					// 中文环境
					document.title = "macOStool工作室 - 鼠标里程";
					$("#app-title").html("<br />鼠标里程(Mouse Odometer)");
					$("#intro-title").text("功能介绍");
					$("#intro-subtitle").html("<strong>实时记录鼠标移动距离，让看不见的日常操作变成看得见的数字</strong>");
					$("#feat-1").text("随时查看鼠标移动距离，让每一次移动都有迹可循");
					$("#feat-2").text("记录鼠标使用以来的总里程，看看你的鼠标究竟走过多远");
					$("#feat-3").text("无需打开主窗口，抬眼就能看到最新里程");
					$("#screenshot").attr("src", "images/mo/cn.png");
				} else {
					// 非中文环境（统一显示英文）
					document.title = "macOStool Studio - Mouse Odometer";
					$("#app-title").html("<br />Mouse Odometer");
					$("#intro-title").text("Features");
					$("#intro-subtitle").html("<strong>Track your mouse movement distance in real time, turning invisible daily actions into visible numbers</strong>");
					$("#feat-1").text("Check your mouse travel distance anytime, leaving a trace for every move");
					$("#feat-2").text("Track total cumulative mileage since you started using your mouse");
					$("#feat-3").text("See the latest mileage at a glance in the menu bar without opening the main window");
					$("#screenshot").attr("src", "images/mo/en.png");
				}
			});
		</script>
	</head>
	<body class="homepage is-preload">
		<div id="page-wrapper">

			<!-- Header -->
				<section id="header" class="wrapper style1">

					<!-- Nav -->
						<nav id="nav">
						</nav>
						
						<!-- Logo -->
							<div id="logo">
								<p class="style2">
								<img src="images/mo/AppIcon-macOS-Default-128x128@2x.png" width="128px"/>
								<h1 id="app-title"><br />鼠标里程(Mouse Odometer)</h1>
								<br />
								<a href="javascript:;" onclick="goStore();">
									<img src="images/downicon.svg" type="image/svg+xml"/>	
								</a>
							</div>
				</section>

			  <!-- Intro -->
				<section id="intro" class="wrapper style1">
				  <div class="title"><p class="style1" id="intro-title">功能介绍</p></div>
				  <br/><br/>
				  <div class="container">
					<p class="style1" id="intro-subtitle"><strong>实时记录鼠标移动距离，让看不见的日常操作变成看得见的数字</strong></p>
					<div class="style1">
					    <p id="feat-1">随时查看鼠标移动距离，让每一次移动都有迹可循</p>
					    <p id="feat-2">记录鼠标使用以来的总里程，看看你的鼠标究竟走过多远</p>
					    <p id="feat-3">无需打开主窗口，抬眼就能看到最新里程</p>
					</div>
					<img id="screenshot" src="images/mo/cn.png" width="560"/>
					</div>
				</section>

			<!-- Footer -->
				<section id="footer" class="wrapper">
					<div class="container" align="center" id="copyright"></div>
				</section> 
		</div>
<!-- Scripts 用于显示侧边菜单-->
			<script src="assets/js/jquery.dropotron.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
	</body>
</html>
